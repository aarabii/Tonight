name: Nightly Catalog Pipeline

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-pipeline
  cancel-in-progress: false

jobs:
  nightly-sync:
    name: Wikidata + Wikipedia + IMDb Delta Sync & DB Size Guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      WIKI_USER_AGENT: ${{ secrets.WIKI_USER_AGENT || 'TonightBot/0.1 (https://github.com/aarabii/Tonight; contact@tonight.app)' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache HuggingFace ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gte-small-v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run nightly delta pipeline
        run: bun --filter @tonight/pipeline nightly

      - name: Run 450 MB database size guard
        run: bun --filter @tonight/pipeline db-size-guard

      - name: Run offline recommendation evaluation
        run: bun --filter @tonight/pipeline eval
